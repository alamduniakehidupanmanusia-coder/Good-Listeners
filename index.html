const clean=s=>s.replace(/\b[A-Z][a-z]+:\s*/g,"");
const sents=s=>clean(s).split(/(?<=[.?!])\s+/).filter(Boolean);
const rx=k=>new RegExp("\\b"+k+"\\b","i");
const IT=RAW.map((s,n)=>{const[l,t,tx,q,o,k,m,x]=s.split("|");return{id:"I"+n,lv:+l,topic:t,tx,q,op:o.split(";"),k,m,x,title:t+" – "+LV[+l][0]}});
const valid=it=>it.lv>=0&&it.lv<6&&it.q&&it.m&&it.x&&it.op.length===4&&new Set(it.op).size===4&&it.op.every(Boolean)&&rx(it.k).test(it.tx)&&sents(it.tx).length>0&&sents(it.tx).some(s=>rx(it.k).test(s));
const OK=IT.filter(valid);
const MN={choose:["Listen and Choose","Pick the right answer","Pilih jawaban yang benar"],cloze:["Listen and Complete","Fill in the missing word","Isi kata yang hilang"],dict:["Dictation Challenge","Type the sentence you hear","Ketik kalimat yang kamu dengar"],vocab:["Vocabulary Listening","Learn a word from audio","Pelajari kata dari audio"]};

if(m==="choose"){q.o=shuf(it.op.map((t,i)=>({t,c:i===0})));q.p=it.q}
else if(m==="cloze"){q.sent=ks.replace(rx(it.k),"______");q.ans=it.k}
else if(m==="dict"){q.aud=ss[0];q.ans=ss[0]}

if(q.o)q.ans=q.o.findIndex(x=>x.c);return q}

${typed&&!G.lock?`<input id="ty" class="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${X("Your answer","Jawabanmu")}" onkeydown="if(event.key==='Enter')sub()">`:""}

${G.lock?`<div class="fb ${G.fb.r===1?"ok":"no"}" role="status">${G.fb.r===1?X("✓ Excellent! Your answer is correct.","✓ Hebat! Jawabanmu benar."):G.fb.r>0?X("◐ Almost there. You got part of it right.","◐ Hampir benar. Sebagian jawabanmu tepat."):X("✗ Not quite. Listen again for the key information.","✗ Belum tepat. Dengarkan kembali informasi pentingnya.")}<br><span style="font-weight:500">${X("Correct answer","Jawaban benar")}: ${esc(q.o?q.o[q.ans].t:q.ans)} · +${G.fb.pts} ${X("points","poin")}<br>${esc(q.it.x)}<br>${X("Key vocabulary","Kosakata penting")}: <b>${esc(q.it.k)}</b> = ${esc(q.it.m)}</span></div>

:`<div class="row" style="margin-top:14px"><span><button class="btn alt" onclick="aid(1)" ${G.h>=1?"disabled":""}>💡 ${X("Hint","Petunjuk")}</button> ${q.m==="choose"&&P.tra?`<button class="btn alt" onclick="aid(2)" ${G.h>=2?"disabled":""}>📄 ${X("Show transcript (max 5 pts)","Lihat transkrip (maks 5 poin)")}</button>`:""} ${G.td?`<button class="btn alt" onclick="next()">${X("Skip","Lewati")}</button>`:""}</span>${typed?`<button class="btn" onclick="sub()">${X("Submit","Kirim")}</button>`:""}</div>`}</div>`}
function aid(l){if(G.lock||G.h>=l)return;G.h=l;G.hu++;const v=E("ty")?E("ty").value:"";draw();if(E("ty")){E("ty").value=v;E("ty").focus()}}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function lcs(a,b){const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
function sub(){if(G.lock)return;const v=E("ty").value.trim();if(!v){E("ty").focus();return}const q=cq();let r;
if(q.m==="cloze")r=norm(v).join(" ")===norm(q.ans).join(" ")?1:0;else{const a=norm(q.ans),b=norm(v);r=Math.max(0,(lcs(a,b)-Math.max(0,b.length-a.length))/a.length)}grade(r,-1)}
function ans(i){grade(cq().o[i].c?1:0,i)}
function grade(r,sel){if(G.lock)return;const q=cq(),it=q.it;G.lock=true;const pts=Math.round([10,7,5][G.h]*r);G.pts+=pts;G.n++;if(r===1)G.ok++;G.fb={r,pts,sel};

if(r===1&&q.m==="choose")S.cm++;if(r===1&&q.m==="dict")S.dc++;
const v=S.v[it.k]||(S.v[it.k]={m:it.m,l:it.lv,tp:it.topic,ex:sents(it.tx).find(s=>rx(it.k).test(s)),r:0,x:0,f:false,mm:false});if(r===1)v.r++;else v.x++;
S.log.push({t:today(),ti:it.title,lv:it.lv,m:q.m,r:Math.round(r*100),p:pts});S.log=S.log.slice(-80);draw();const b=E("nx");if(b)b.focus()}

function finish(){clearInterval(T);stopA();if(!G||G.done)return;const g=G;g.done=true;

S.hist.push({t:new Date().toISOString().slice(0,16).replace("T"," "),m:g.m,l:g.lv,n:g.n,p:g.pts,a:g.n?Math.round(g.ok/g.n*100):0});S.hist=S.hist.slice(-20);
BD.forEach(b=>{if(b[4]()&&!S.bd[b[0]]){S.bd[b[0]]=today();g.newb.push(b[1])}});sv();view="result";draw()}
function result(){const g=G;return`<h1>${g.td?X("Time's up!","Waktu habis!"):X("Session complete!","Sesi selesai!")}</h1><p>👤 ${esc(ID.n)} · ${X("Class","Kelas")} ${esc(ID.c)} · ${esc(ID.s)}</p>
<div class="grid"><div class="card stat"><b>${g.pts}</b><span>${X("Points","Poin")}</span></div><div class="card stat"><b>${g.ok}/${g.n}</b><span>${X("Correct","Benar")}</span></div><div class="card stat"><b>${acc(g.ok,g.n)}</b><span>${X("Accuracy","Akurasi")}</span></div><div class="card stat"><b>${g.rp}</b><span>${X("Replays","Pemutaran ulang")}</span></div>${g.bonus?`<div class="card stat"><b>+${g.bonus}</b><span>Bonus</span></div>`:""}</div>
<p>${g.n>=5&&g.ok/g.n>=.7?X("Great job! You passed this level.","Kerja bagus! Kamu lulus level ini."):X("Keep practicing. A level is passed with 70% accuracy over at least 5 answers.","Terus berlatih. Level lulus dengan akurasi 70% pada minimal 5 jawaban.")}</p>${g.newb.length?`<p>🏅 ${X("New badge","Lencana baru")}: <b>${g.newb.map(b=>esc(X(b,BDI[b]))).join(", ")}</b></p>`:""}
<div class="row l"><button class="btn y" onclick="MODE='${g.m}';${g.topic?`startT('${g.topic.replace(/'/g,"\\'")}')`:`start(${g.lv})`}">${X("Practice again","Latihan lagi")}</button><button class="btn alt" onclick="go('practice')">${X("Change level","Ganti level")}</button><button class="btn alt" onclick="go('home')">${X("Dashboard","Beranda")}</button></div>`}
/* vocabulary, journal, progress, badges, certificate */
const vst=e=>e.mm||e.r>=3?"Mastered":e.r===2?"Practicing":e.r+e.x<=1?"New":"Learning";
const VS={All:["All","Semua"],fav:["★ Favorites","★ Favorit"],New:["New","Baru"],Learning:["Learning","Sedang Dipelajari"],Practicing:["Practicing","Berlatih"],Mastered:["Mastered","Dikuasai"]};
function vocab(){const q=vq.toLowerCase(),rows=Object.entries(S.v).filter(([w,e])=>(!q||w.includes(q)||e.m.toLowerCase().includes(q)||e.tp.toLowerCase().includes(q))&&(vf==="All"||(vf==="fav"?e.f:vst(e)===vf))).sort((a,b)=>a[0]<b[0]?-1:1);
if(!Object.keys(S.v).length)return`<h1>${X("Vocabulary Bank","Bank Kosakata")}</h1><div class="card">${X("Words from the audio you practice appear here.","Kata dari audio yang kamu latih muncul di sini.")}</div>`;
return`<h1>${X("Vocabulary Bank","Bank Kosakata")}</h1><input id="vq" class="fi" placeholder="${X("Search word, meaning or topic","Cari kata, arti, atau topik")}" aria-label="search" value="${esc(vq)}" oninput="vq=this.value;draw()"><div class="row l" style="margin-bottom:12px">${Object.entries(VS).map(([k,v])=>`<button class="btn ${vf===k?"y":"alt"}" onclick="vf='${k}';draw()">${X(v[0],v[1])}</button>`).join("")}</div>
<div class="card" style="overflow-x:auto">${rows.length?`<table><tr><th>${X("Word","Kata")}</th><th>${X("Meaning","Arti")}</th><th>${X("Example","Contoh")}</th><th>${X("Topic","Topik")}</th><th>${X("Level","Level")}</th><th>${X("Status","Status")}</th><th></th></tr>${rows.map(([w,e])=>`<tr><td><b>${w}</b></td><td>${esc(e.m)}</td><td>${esc(e.ex||"")}</td><td>${esc(e.tp)}</td><td>${LV[e.l][0]}</td><td>${X(VS[vst(e)][0],VS[vst(e)][1])}</td><td style="white-space:nowrap"><button class="btn alt" style="padding:2px 10px;min-height:32px" aria-label="Listen ${w}" onclick="sayW('${w}')">🔊</button> <button class="btn alt" style="padding:2px 10px;min-height:32px" aria-label="Favorite ${w}" onclick="vfav('${w}')">${e.f?"★":"☆"}</button> <button class="btn alt" style="padding:2px 10px;min-height:32px" onclick="vmas('${w}')">${e.mm?"↺":"✓"}</button></td></tr>`).join("")}</table>`:X("No words match.","Tidak ada kata yang cocok.")}</div><p class="note">🔊 ${X("play","putar")} · ★ ${X("favorite","favorit")} · ✓ ${X("mark as mastered","tandai dikuasai")}</p>`}
function sayW(w){if(!TTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function vfav(w){S.v[w].f=!S.v[w].f;sv();draw()}function vmas(w){S.v[w].mm=!S.v[w].mm;sv();draw()}
function journal(){const q=jq.toLowerCase(),rows=S.log.filter(e=>(jlv<0||e.lv===jlv)&&(!q||e.ti.toLowerCase().includes(q))).slice().reverse();
return`<h1>${X("My Listening Journal","Jurnal Listening Saya")}</h1>`+(S.log.length?`<input id="jq" class="fi" placeholder="${X("Search audio title or topic","Cari judul audio atau topik")}" aria-label="search" value="${esc(jq)}" oninput="jq=this.value;draw()"><div class="row l" style="margin-bottom:12px">${[-1,0,1,2,3,4,5].map(i=>`<button class="btn ${jlv===i?"y":"alt"}" onclick="jlv=${i};draw()">${i<0?X("All levels","Semua level"):LV[i][0]}</button>`).join("")}</div>
<div class="card" style="overflow-x:auto">${rows.length?`<table><tr><th>${X("Date","Tanggal")}</th><th>${X("Audio","Audio")}</th><th>${X("Mode","Mode")}</th><th>${X("Result","Hasil")}</th><th>${X("Points","Poin")}</th></tr>${rows.map(e=>`<tr><td>${e.t}</td><td>${esc(e.ti)}</td><td>${esc(MN[e.m][0])}</td><td>${e.r}%</td><td>${e.p}</td></tr>`).join("")}</table>`:X("No entries match.","Tidak ada entri yang cocok.")}</div>`:`<div class="card">${X("Your listening history appears here after your first practice.","Riwayat listeningmu muncul di sini setelah latihan pertama.")}</div>`)}
function progress(){const h=S.hist.slice(-10),tp=Object.entries(S.tp).filter(e=>e[1].a>0).sort((a,b)=>b[1].o/b[1].a-a[1].o/a[1].a);
return`<h1>${X("My Progress","Progres Saya")}</h1><div class="grid">${[[X("Total sessions","Total sesi"),S.sess],[X("Total questions","Total soal"),S.ans],[X("Wrong answers","Jawaban salah"),S.ans-S.ok],[X("Accuracy","Akurasi"),acc(S.ok,S.ans)],[X("Total score","Skor total"),S.pts],[X("Replays used","Pemutaran ulang"),S.rp],[X("Words learned","Kata dipelajari"),Object.keys(S.v).length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="card"><h3>${X("Progress by level","Progres per level")}</h3>${LV.map((l,i)=>{const s=S.lv[i];return`<div style="margin-bottom:10px"><div class="row"><b>${l[0]}</b><span>${s.a?s.o+"/"+s.a+" · "+acc(s.o,s.a):X("Not played yet","Belum dimainkan")}</span></div><div class="bar" style="background:var(--blue2)"><i style="width:${s.a?s.o/s.a*100:0}%"></i></div></div>`}).join("")}</div>
<div class="card"><h3>${X("Progress by topic","Progres per topik")}</h3>${tp.length?tp.map(e=>`<p style="margin:4px 0"><b>${esc(e[0])}</b>: ${e[1].o}/${e[1].a} · ${acc(e[1].o,e[1].a)}</p>`).join(""):"<p>—</p>"}</div>
<div class="card"><h3>${X("Accuracy by session (latest 10)","Akurasi per sesi (10 terakhir)")}</h3>${h.length?`<div class="hbar" role="img" aria-label="chart">${h.map(x=>`<i title="${x.a}%" style="height:${Math.max(3,x.a)}%"></i>`).join("")}</div>`:"<p>—</p>"}</div>
<div class="card"><h3>${X("Next step","Langkah berikutnya")}</h3><p>${rec()}</p></div>`}
function badges(){return`<h1>${X("Achievements","Pencapaian")}</h1><div class="grid">${BD.map(b=>`<div class="card badge ${S.bd[b[0]]?"got":""}"><h3>${S.bd[b[0]]?b[3]:"🔒"} ${esc(X(b[1],BDI[b[1]]))}</h3><span>${X(b[2],"")||b[2]}</span><br><b>${S.bd[b[0]]?X("Earned","Diraih"):X("Locked","Terkunci")}</b>${S.bd[b[0]]?" · "+S.bd[b[0]]:""}</div>`).join("")}</div>`}
function cert(){const pl=S.lv.map((l,i)=>l.s>0?i:-1).filter(i=>i>=0);
if(!pl.length)return`<h1>${X("Certificate","Sertifikat")}</h1><div class="card">${X("Pass a level (70%+ accuracy over at least 5 answers) to unlock its certificate.","Lulus satu level (akurasi 70%+ pada minimal 5 jawaban) untuk membuka sertifikatnya.")}</div>`;
const lv=pl.includes(CL)?CL:pl[pl.length-1],L=S.lv[lv];
return`<h1>${X("Certificate","Sertifikat")}</h1><div class="row l noprint" style="margin-bottom:12px">${pl.map(i=>`<button class="btn ${i===lv?"y":"alt"}" onclick="CL=${i};draw()">${LV[i][0]}</button>`).join("")}<button class="btn" onclick="window.print()">${X("Print Certificate","Cetak Sertifikat")}</button></div><p class="note noprint">${X("Save as PDF uses your browser's print dialog.","Simpan sebagai PDF memakai dialog cetak peramban.")}</p>
<div class="cert"><div style="font-size:40px" aria-hidden="true">🎧</div><h1>${X("Certificate of Achievement","Sertifikat Pencapaian")}</h1><p>Good Listeners</p><p>${X("This certificate is proudly presented to","Sertifikat ini diberikan kepada")}</p><h2>${esc(ID.n)}</h2>
<p>${X("Class","Kelas")} ${esc(ID.c)} · ${X("Attendance No.","No. Presensi")} ${esc(ID.a)}<br>${esc(ID.s)}</p><p>${X("for passing the listening level","atas keberhasilan lulus level listening")} <b>${LV[lv][0]}</b><br>${X("Best score","Skor terbaik")}: <b>${L.b}</b> · ${X("Level accuracy","Akurasi level")}: <b>${acc(L.o,L.a)}</b></p>
<p>${today()}</p><p><b>Created by Ahmad Budi Leksono</b></p><p class="note">${X("Not an official school certification.","Bukan sertifikasi resmi lembaga pendidikan.")}</p></div>`}
/* settings, about */
const pset=(k,v)=>{P[k]=v;if(k==="theme"){if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}sv();draw()};
if(P.theme)document.documentElement.dataset.theme=P.theme;
function settings(){const b=(k,v,l)=>`<button class="btn ${P[k]===v?"y":"alt"}" aria-pressed="${P[k]===v}" onclick="pset('${k}',${JSON.stringify(v)})">${l}</button>`,oo=k=>b(k,true,X("On","Aktif"))+b(k,false,X("Off","Nonaktif"));
return`<h1>${X("Settings","Pengaturan")}</h1><div class="card"><h3>${X("Language","Bahasa")}</h3><div class="row l"><button class="btn ${P.lang==="id"?"y":"alt"}" onclick="setLang('id')">🇮🇩 Bahasa Indonesia</button><button class="btn ${P.lang==="en"?"y":"alt"}" onclick="setLang('en')">🇬🇧 English</button></div></div>
<div class="card"><h3>${X("Theme","Tema")}</h3><div class="row l">${b("theme","light",X("Light","Terang"))}${b("theme","dark",X("Dark","Gelap"))}${b("theme","",X("Match device","Ikuti perangkat"))}</div></div>
<div class="card"><h3>${X("Playback speed","Kecepatan pemutaran")}</h3><div class="row l">${[.75,1,1.25].map(s=>b("speed",s,s+"×")).join("")}</div><h3 style="margin-top:12px">${X("Questions per session","Soal per sesi")}</h3><div class="row l">${[5,10].map(n=>b("nq",n,n)).join("")}</div></div>
<div class="card"><h3>${X("Show transcript after answering","Tampilkan transkrip setelah menjawab")}</h3><div class="row l">${oo("trs")}</div><h3 style="margin-top:12px">${X("Allow the transcript aid (Listen and Choose)","Izinkan bantuan transkrip (Listen and Choose)")}</h3><div class="row l">${oo("tra")}</div><h3 style="margin-top:12px">${X("Animations","Animasi")}</h3><div class="row l">${oo("anim")}</div></div>
<div class="card"><button class="btn alt" onclick="Object.assign(P,{theme:'',nq:5,anim:true,speed:1,trs:true,tra:true});delete document.documentElement.dataset.theme;sv();draw()">${X("Restore default settings","Kembalikan pengaturan awal")}</button></div>
<div class="card"><p class="note">${X("Progress lives in this browser on this device only. It can be lost if browser data is cleared.","Progres hanya tersimpan di peramban pada perangkat ini. Data bisa hilang jika data peramban dihapus.")}</p>${rst?`<p><b>${X("Delete this student's progress? This cannot be undone.","Hapus progres murid ini? Tindakan ini tidak dapat dibatalkan.")}</b></p><button class="btn" onclick="S=fresh();sv();rst=false;draw()">${X("Yes, delete","Ya, hapus")}</button> <button class="btn alt" onclick="rst=false;draw()">${X("Cancel","Batal")}</button>`:`<button class="btn alt" onclick="rst=true;draw()">${X("Reset this student's progress","Reset progres murid ini")}</button>`}</div>`}
function about(){return`<h1>Good Listeners</h1><p><i>${X("Listen Carefully, Understand Confidently!","Dengarkan dengan Saksama, Pahami dengan Percaya Diri!")}</i></p><div class="card"><p>${X("Good Listeners is an interactive English listening comprehension platform that helps students understand spoken English, learn vocabulary from audio, and answer questions with confidence.","Good Listeners adalah platform listening bahasa Inggris interaktif yang membantu murid memahami bahasa Inggris lisan, mempelajari kosakata dari audio, dan menjawab soal dengan percaya diri.")}</p><h3>Created by Ahmad Budi Leksono</h3><p class="note">v1.0 · ${OK.length} ${X("validated audio items","soal audio tervalidasi")}</p></div>`}
const V={reg,home,practice,levels,topics,vocab,journal,progress,badges,cert,settings,about,game,result,sw};
draw();
</script></body></html>
